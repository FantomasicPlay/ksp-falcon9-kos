<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>KSP Overlay</title>
<style>
  :root{
    --ink:      #ffffff;
    --dim:      rgba(255,255,255,.42);
    --faint:    rgba(255,255,255,.20);
    --track:    rgba(255,255,255,.22);
    --scale:    1;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  html,body{
    width:100%; height:100%;
    background:transparent; overflow:hidden;
    color:var(--ink);
    font-family:"Bahnschrift","Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;
    font-variation-settings:"wdth" 87;
    -webkit-font-smoothing:antialiased;
    user-select:none; cursor:none;
  }

  .num{ font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1; }

  #bar{
    position:absolute; left:0; right:0; bottom:0;
    height:calc(206px * var(--scale));
    display:grid; grid-template-columns:1fr auto 1fr; align-items:center;
    padding:0 calc(64px * var(--scale)) calc(16px * var(--scale));
    opacity:1; transition:opacity .4s;
  }

  .plate{
    position:absolute; bottom:0; pointer-events:none; overflow:visible;
    width:calc(592px * var(--s)); height:calc(181px * var(--s));
  }
  .plate.left { left:0; }
  .plate.right{ right:0; }
  .plate{ transition:opacity .52s ease, transform .52s cubic-bezier(.2,.85,.25,1);
          transform:translateX(0); }
  .plate.left.plate-off { opacity:0; transform:translateX(-100%); }
  .plate.right.plate-off{ opacity:0; transform:translateX(100%); }

  #centerbg{
    position:absolute; left:50%; bottom:0; transform:translateX(-50%);
    width:min(calc(1700px * var(--scale)), 88vw);
    height:210%; pointer-events:none;
    background:radial-gradient(ellipse 46% 46% at 50% 82%,
      rgba(3,7,12,.80) 0%, rgba(3,7,12,.62) 34%, rgba(3,7,12,.34) 58%,
      rgba(3,7,12,.12) 78%, rgba(3,7,12,0) 100%);
  }

  .side{ display:block; position:static; }
  #center{ position:relative; z-index:1; }
  .stack, .pair{ display:block; }
  .vehicle{
    position:absolute; bottom:calc(25px * var(--s)); transform:translateX(-50%);
    font-family:"VTF Justina GEO","Bahnschrift","Segoe UI",system-ui,sans-serif;
    font-size:calc(15px * var(--s)); font-weight:700; line-height:1;
    text-transform:uppercase; color:#fff; white-space:nowrap; z-index:1;
  }
  .side.left  .vehicle{ left:calc(237.1px * var(--s)); }
  .side.right .vehicle{ left:calc(1682.3px * var(--s)); }

  .gauge, .engines{
    position:absolute; bottom:calc(15px * var(--s)); z-index:1;
    width:calc(151px * var(--s)); height:calc(151px * var(--s));
  }
  #b-eng, #b-spd{ left:calc(80.5px * var(--s)); }
  #b-att, #b-alt{ left:calc(243.5px * var(--s)); }
  #r-spd, #s-spd, #s-att{ left:calc(1526.5px * var(--s)); }
  #r-alt, #s-eng, #s-g  { left:calc(1689.5px * var(--s)); }
  .gauge svg, .engines svg{ position:absolute; inset:0; width:100%; height:100%; overflow:visible; }
  .gauge text, .engines text{ font-family:"VTF Justina GEO","Bahnschrift","Segoe UI",system-ui,sans-serif; fill:#fff; }
  .g-cap { font-size:15px; font-weight:700; fill-opacity:.75; }
  .g-val { font-size:34px; font-weight:700; }
  .g-unit{ font-size:15px; font-weight:700; fill-opacity:.75; }
  .ring-bg, .fuel-bg{ fill:none; stroke:#fff; stroke-opacity:.5; stroke-width:14; }
  .ring-fg, .fuel-fg{ fill:none; stroke:#fff; stroke-width:14; transition:stroke-dashoffset .12s linear; }
  .fuel-fg{ transition:stroke-dashoffset .15s linear; }
  .rim{ fill:none; stroke:#fff; stroke-opacity:.5; }
  .att .rim{ stroke-width:2; }

  .engdot{ fill:#fff; fill-opacity:.5; }
  .lit{ fill:#fff; transform:scale(0); transform-box:fill-box; transform-origin:center;
        transition:transform .32s cubic-bezier(.2,.9,.3,1.15); }
  .lit.on{ transform:scale(1); }

  body.mode-booster .vehicle{ display:none; }

  .att .craft{ fill:none; stroke:#fff; stroke-width:.5; }

  #center{ display:flex; flex-direction:column; align-items:center; justify-content:center;
           width:min(calc(980px * var(--scale)), 55vw);
           transform:translateY(calc(34px * var(--scale))); }
  #b-eng, #b-att, #b-spd, #b-alt, #r-spd, #r-alt, #s-spd, #s-eng, #s-att, #s-g{
    transition: opacity .42s ease, transform .42s cubic-bezier(.2,.85,.25,1);
    display: none;
  }
  .w-off{ opacity:0 !important; transform:translateY(14px) scale(.9); }
  .pre-reveal > *{ opacity:0; }
  .vehicle{ transition: opacity .42s ease; }
  body.mode-pad .vehicle{ opacity:0; }
  body.mode-ship .vehicle{ opacity:0; }
  body.has-att .vehicle{ opacity:0; }

  @keyframes engpop{
    from{ opacity:0; }
    to  { opacity:1; }
  }
  .revealing .lit, .revealing .engdot{
    animation: engpop .38s ease-out both;
    animation-delay: var(--d, 0ms);
  }
  .revealing .rim, .revealing .ring-bg, .revealing .ring-fg, .revealing .engring{
    animation: engpop .5s ease both;
  }

  #arcwrap{
    position:absolute; left:0; right:0; bottom:0;
    height:calc(224px * var(--scale)); pointer-events:none; z-index:0;
  }
  #arcwrap svg{ position:absolute; inset:0; width:100%; height:100%; overflow:visible;
                filter:drop-shadow(0 2px 7px rgba(0,0,0,.9)); }
  .arc-bg{ fill:none; stroke:var(--track); stroke-width:1.6; }
  .arc-inner{ fill:none; stroke:rgba(255,255,255,.30); stroke-width:1.2; }
  .arc-fg{ fill:none; stroke:var(--ink); stroke-width:1.6; transition:stroke-dashoffset .12s linear; }
  .ms-dot{ fill:rgba(0,0,0,.72); stroke:var(--track); stroke-width:1.8; }
  .ms-dot.done{ stroke:var(--ink); stroke-width:2.4; }
  .ms-core{ fill:var(--ink); opacity:0; transition:opacity .2s linear; }
  .ms-core.done{ opacity:1; }
  .ms-txt{
    font-size:calc(15px * var(--scale)); font-weight:700; letter-spacing:.08em;
    text-transform:uppercase; fill:var(--track);
  }
  .ms-txt.done{ fill:var(--ink); }
  #nowtick{ stroke:var(--ink); stroke-width:2; }

  #met{
    font-size:calc(54px * var(--scale)); font-weight:300; line-height:1;
    letter-spacing:.005em; margin-top:calc(-16px * var(--scale)); white-space:nowrap;
    text-shadow:0 2px 10px rgba(0,0,0,.95), 0 0 3px rgba(0,0,0,.8);
  }
  #met .tp{ font-size:calc(35px * var(--scale)); font-weight:400; margin-right:calc(4px * var(--scale)); }
  #mission{
    font-size:calc(14px * var(--scale)); font-weight:700; letter-spacing:.13em;
    text-transform:uppercase; color:var(--dim); margin-top:calc(6px * var(--scale));
    text-shadow:0 2px 8px rgba(0,0,0,.95);
  }

  #center, #arcwrap{
    transition:opacity .5s ease, transform .5s cubic-bezier(.2,.85,.25,1);
  }
  body.mode-pad #center, body.mode-pad #arcwrap{
    opacity:0; transform:translateY(calc(18px * var(--scale)));
  }

  #topclock{
    position:absolute; left:0; top:calc(60px * var(--s)); overflow:visible;
    width:calc(317px * var(--s)); height:calc(100px * var(--s));
    z-index:2; transition:opacity .5s ease, transform .5s cubic-bezier(.3,.1,.25,1);
  }
  #topclock text{ font-family:"VTF Justina GEO","Bahnschrift","Segoe UI",system-ui,sans-serif; fill:#fff; }
  .t-tp { font-size:19.6px; font-weight:400; }
  .t-met{ font-size:32px; font-weight:700; }
  .t-mis{ font-size:16px; font-weight:700; }
  #tophold{ display:none; }
  body.hold #tophold{ display:inline; }
  body.hold #toptp{ display:none; }
  body.launched-ui #topclock{
    opacity:0; transform:translateY(calc(-26px * var(--s)));
    pointer-events:none;
  }

  body.stale #bar{ opacity:.45; }
  #nodata{
    position:absolute; left:50%; bottom:calc(218px * var(--scale)); transform:translateX(-50%);
    font-size:calc(12px * var(--scale)); letter-spacing:.18em; text-transform:uppercase;
    color:rgba(255,180,90,.9); opacity:0; transition:opacity .35s; white-space:nowrap;
  }
  body.stale #nodata{ opacity:1; }

  #jserr{
    position:absolute; left:calc(16px * var(--scale)); top:calc(16px * var(--scale));
    max-width:70vw; padding:.5em .8em; background:rgba(40,4,4,.88);
    border:1px solid rgba(255,90,90,.6); border-radius:6px;
    font:calc(13px * var(--scale))/1.4 monospace; color:#ff9a9a;
    white-space:pre-wrap; z-index:50; display:none;
  }
</style>
</head>
<body class="stale">

<div id="nodata">NO DATA FROM KOS</div>
<div id="jserr"></div>

<svg id="topclock" viewBox="0 0 317 100">
  <path d="M308.956 0H0V60H239.683C250.252 60 260.512 56.4381 268.807 49.8895L313.913 14.2791C319.869 9.57714 316.544 0 308.956 0Z" fill="#000" fill-opacity=".25"/>
  <text id="toptp" class="t-tp" x="46" y="38">T-</text>
  <path id="tophold" d="M55 17C62.1797 17 68 22.8203 68 30C68 37.1797 62.1797 43 55 43C47.8203 43 42 37.1797 42 30C42 22.8203 47.8203 17 55 17ZM50 25V36H53V25H50ZM57 25V36H60V25H57Z" fill="#fff"/>
  <text id="topmet" class="t-met" x="84.5" y="41.9">00:00:00</text>
  <text id="topmission" class="t-mis" x="45" y="85">STARSHIP FLIGHT TEST</text>
</svg>

<div id="bar">

  <div id="centerbg"></div>
  <svg class="plate left plate-off" viewBox="0 901 592 181">
    <defs>
      <linearGradient id="plGL" x1="449.5" y1="992.5" x2="583.5" y2="992.75" gradientUnits="userSpaceOnUse">
        <stop offset=".477253"/><stop offset="1" stop-opacity="0"/>
      </linearGradient>
    </defs>
    <path d="M0 1082H591L396.449 923.483C386.649 915.523 381.749 911.543 376.277 908.711C371.423 906.199 366.248 904.363 360.896 903.252C354.864 902 348.551 902 335.925 902H0V1082Z" fill="url(#plGL)" fill-opacity=".25"/>
  </svg>
  <svg class="plate right plate-off" viewBox="1328 901 592 181">
    <defs>
      <linearGradient id="plGR" x1="1469.5" y1="991.5" x2="1335.5" y2="991.75" gradientUnits="userSpaceOnUse">
        <stop offset=".477253"/><stop offset="1" stop-opacity="0"/>
      </linearGradient>
    </defs>
    <path d="M1920 1082H1328L1522.55 922.483C1532.35 914.523 1537.25 910.543 1542.72 907.711C1547.58 905.199 1552.75 903.363 1558.1 902.252C1564.14 901 1570.45 901 1583.07 901H1920V1082Z" fill="url(#plGR)" fill-opacity=".25"/>
  </svg>

  <div class="side left">
    <div class="stack">
      <div class="pair">
        <div class="engines" id="b-eng"><svg></svg></div>
        <div class="engines att" id="b-att"><svg></svg></div>
        <div class="gauge" id="b-spd"></div>

  <div id="arcwrap"><svg id="arcsvg"></svg></div>

  <div id="center">
    <div id="met" class="num"><span class="tp">T+</span>00:00:00</div>
    <div id="mission">Starship Flight Test</div>
  </div>

  <div class="side right">
    <div class="stack">
      <div class="pair">
        <div class="gauge" id="r-spd"></div>
        <div class="gauge" id="r-alt"></div>
        <div class="gauge" id="s-spd"></div>
        <div class="gauge" id="s-g"></div>
        <div class="engines att" id="s-att"><svg></svg></div>
        <div class="engines" id="s-eng"><svg></svg></div>
      </div>
      <div class="vehicle">Starship</div>
    </div>
  </div>

</div>

<script>

const SVGNS = "http://www.w3.org/2000/svg";
const $ = id => document.getElementById(id);

const LAYOUT = {
  pad:     [],
  booster: ["b-eng", "b-att", "r-spd", "r-alt"],
  dual:    ["b-eng", "b-att", "s-spd", "s-eng"],
  descent: ["b-spd", "b-alt", "s-spd", "s-eng"],
  land:    ["b-eng", "b-alt", "s-spd", "s-eng"],
  ship:    ["b-spd", "b-alt", "s-att", "s-eng"],
  shipg:   ["b-spd", "b-alt", "s-att", "s-g"]
};
const SHOW_AT = -5;
const ENG_REVEAL_AT = 5000;
const SHIP_ENG_AT   = 10000;
const SHIP_SPD_FULL_KMH = 12900;
const SHIP_ALT_FULL_KM  = 125;
const ALL_WIDGETS = ["b-eng", "b-att", "b-spd", "b-alt", "r-spd", "r-alt", "s-spd", "s-eng", "s-att", "s-g"];
let curMode = "";
let launched = false;
let lastPhase = "idle";
const SWEEPABLE = new Set(["b-spd","b-alt","r-spd","r-alt","s-spd","s-g","b-eng","s-eng"]);
const pendingSweep = new Set();
function takeSweep(id){ return pendingSweep.delete(id); }
const pendingShow = new Set();

const HIDE_MS = 430;
const PLATE_LEAD_MS = 220;

for (const id of ALL_WIDGETS){
  const el = document.getElementById(id);
  if (el) el.dataset.shown = "0";
}

function revealEngines(id){
  const el = document.getElementById(id);
  if (!el) return;
  el.classList.remove("pre-reveal");
  el.classList.remove("revealing");
  void el.offsetWidth;
  el.classList.add("revealing");
  el.querySelectorAll(".lit, .engdot, .rim").forEach(d => { d.style.opacity = ""; });
  setTimeout(() => el.classList.remove("revealing"), 1200);
  drawTrack(el);
}

function drawTrack(el){
  const track = el.querySelector(".ring-bg");
  if (!track) return;
  track.style.transition = "stroke-dashoffset 620ms cubic-bezier(.2,.8,.2,1)";
  requestAnimationFrame(() => track.setAttribute("stroke-dashoffset", "0"));
}

function hideTrackInstant(el){
  const track = el.querySelector(".ring-bg");
  if (track){
    track.style.transition = "none";
    track.setAttribute("stroke-dashoffset", LEN.toFixed(2));
  }
  el.querySelectorAll(".lit, .engdot, .rim").forEach(d => { d.style.opacity = "0"; });
}

function revealWidget(el, id){
  el.dataset.shown = "1";
  clearTimeout(+el.dataset.tid || 0);
  el.style.display = "block";
  if (SWEEPABLE.has(id)){
    el.classList.add("pre-reveal");
    hideTrackInstant(el);
  }
  el.classList.add("w-off");
  setTimeout(() => {
    if (el.dataset.shown !== "1") return;
    requestAnimationFrame(() => requestAnimationFrame(() => el.classList.remove("w-off")));
    if (SWEEPABLE.has(id)){
      setTimeout(() => {
        if (el.dataset.shown !== "1") return;
        revealEngines(id);
        pendingSweep.add(id);
      }, 460);
    }
  }, PLATE_LEAD_MS);
}

function applyLayout(mode){
  if (mode === curMode) return;
  curMode = mode;
  const on = LAYOUT[mode] || LAYOUT.booster;

  let anyHiding = false;
  const toShow = [];
  for (const id of ALL_WIDGETS){
    const el = document.getElementById(id);
    if (!el) continue;
    const show = on.includes(id);
    if (show === (el.dataset.shown === "1")) continue;
    if (show){
      toShow.push(id);
    } else {
      anyHiding = true;
      el.dataset.shown = "0";
      el.classList.add("w-off");
      el.dataset.tid = setTimeout(() => {
        if (el.dataset.shown === "0") el.style.display = "none";
      }, HIDE_MS);
    }
  }
  const doShow = () => {
    for (const id of toShow){
      pendingShow.delete(id);
      const el = document.getElementById(id);
      if (el && curMode === mode) revealWidget(el, id);
    }
  };
  if (anyHiding && toShow.length){
    for (const id of toShow) pendingShow.add(id);
    setTimeout(doShow, HIDE_MS);
  }
  else doShow();
  const LEFT_IDS  = ["b-eng", "b-att", "b-spd", "b-alt"];
  const RIGHT_IDS = ["r-spd", "r-alt", "s-spd", "s-eng", "s-att", "s-g"];
  const pl = document.querySelector(".plate.left"), pr = document.querySelector(".plate.right");
  if (pl) pl.classList.toggle("plate-off", !LEFT_IDS.some(id => on.includes(id)));
  if (pr) pr.classList.toggle("plate-off", !RIGHT_IDS.some(id => on.includes(id)));

  document.body.classList.toggle("mode-booster", mode === "booster");
  document.body.classList.toggle("mode-pad", mode === "pad");
  document.body.classList.toggle("mode-ship", mode === "ship" || mode === "shipg");
  document.body.classList.toggle("has-att", on.includes("b-att") || on.includes("s-att"));
  document.body.classList.toggle("launched-ui", mode !== "pad");
}

function fitScale(){
  const bar = document.getElementById("bar");
  const w = (bar && bar.clientWidth) || window.innerWidth;
  const s = Math.max(.62, Math.min(1.5, w / 2000));
  document.documentElement.style.setProperty("--scale", s.toFixed(3));
  document.documentElement.style.setProperty("--s", Math.max(.5, Math.min(2, w / 1920)).toFixed(4));
}
addEventListener("resize", fitScale); fitScale();

function Chan(){ return { prev:null, next:null, tNext:0, alive:0 }; }
const B = Chan(), S = Chan();

function push(ch, d){
  ch.prev = ch.next ?? d;
  ch.next = d;
  ch.tNext = performance.now();
  ch.alive = performance.now();
}
function lerp(ch, key){
  if (!ch.next) return null;
  const b = ch.next[key];
  if (b === undefined) return null;
  const a = ch.prev?.[key];
  if (a === undefined) return b;
  const k = Math.min(1, (performance.now() - ch.tNext) / 100);
  return a + (b - a) * k;
}
function ang(ch, key){
  if (!ch.next) return null;
  let b = ch.next[key]; if (b === undefined) return null;
  let a = ch.prev?.[key]; if (a === undefined) return b;
  const d = ((b - a + 540) % 360) - 180;
  const k = Math.min(1, (performance.now() - ch.tNext) / 100);
  return a + d * k;
}
const fresh = ch => ch.next && (performance.now() - ch.alive) < 2500;

if (window.chrome && window.chrome.webview){
  window.chrome.webview.addEventListener("message", e => {
    let m; try { m = JSON.parse(e.data); } catch { return; }
    if (m.kind === "telemetry" && m.who !== "ship" && m.data && m.data.veh === "f9"
        && !/[?&]sandbox(=|&|$)/.test(location.search)){ location.replace("falcon9.html"); return; }
    if (m.kind === "telemetry") push(m.who === "ship" ? S : B, m.data);
  });
}

const RING_D = "M156 922C194.972 922 226 953.752 226 992.841C226 1005.81 222.938 1017.28 215.686 1027.24L215.231 1027.93L208 1023.14L209.418 1021L212.521 1023.05C218.409 1014.4 221 1004.41 221 992.841C221 956.442 192.139 927 156 927C119.861 927 91.0002 956.442 91 992.841C91 1004.1 93.8788 1014.36 99.209 1023L102.231 1021L103.649 1023.14L96.418 1027.93L95 1025.79L95.0371 1025.76C89.1375 1016.26 86 1005.03 86 992.841C86.0002 953.752 117.028 922 156 922Z";
const GAP = 242, ARC_ROT = 149, R = 66, C = 2 * Math.PI * R, LEN = C * GAP / 360;
let widgetN = 0;

function widgetBase(svg, g0, g1){
  const id = "wg" + (widgetN++);
  svg.setAttribute("viewBox", "-75.5 -76.841 151 151");
  return { id, html:
    `<defs>
       <linearGradient id="${id}b" x1="0" y1="-76.841" x2="0" y2="74.159" gradientUnits="userSpaceOnUse">
         <stop offset="${g0}"/><stop offset="${g1}" stop-opacity="0"/>
       </linearGradient>
       <mask id="${id}m" maskUnits="userSpaceOnUse" x="-80" y="-80" width="160" height="160">
         <path d="${RING_D}" transform="translate(-156 -992.841)" fill="#fff"/>
       </mask>
     </defs>
     <circle cx="0" cy="0" r="75.5" fill="url(#${id}b)" fill-opacity=".25"/>` };
}

function ringHTML(id, cls){
  return `<g mask="url(#${id}m)">
     <circle class="${cls}-bg" r="${R}" transform="rotate(${ARC_ROT})" stroke-dasharray="${LEN} ${C}"/>
     <circle class="${cls}-fg" r="${R}" transform="rotate(${ARC_ROT})" stroke-dasharray="${LEN} ${C}" stroke-dashoffset="${LEN}"/>
   </g>`;
}

function makeGauge(el, cap, unit){
  el.innerHTML = "<svg></svg>";
  const svg = el.firstChild, b = widgetBase(svg, .403846, .798077);
  svg.innerHTML = b.html + ringHTML(b.id, "ring") +
    `<text class="g-cap" x="0" y="-27.84" text-anchor="middle">${cap.toUpperCase()}</text>
     <text class="g-val" x="0" y="10.16" text-anchor="middle">—</text>
     <text class="g-unit" x="0" y="33.16" text-anchor="middle">${unit.toUpperCase()}</text>`;
  return { fg: svg.querySelector(".ring-fg"), val: svg.querySelector(".g-val") };
}

function setGauge(g, value, frac, digits, sweep){
  g.val.textContent = value === null ? "—" : value.toFixed(digits);
  const f = Math.max(0, Math.min(1, frac || 0));
  const target = (LEN * (1 - f)).toFixed(2);
  g._target = target;
  const now = performance.now();
  if (sweep){
    g._sweepUntil = now + 1080;
    g.fg.style.transitionDuration = "0s";
    g.fg.setAttribute("stroke-dashoffset", LEN.toFixed(2));
    void g.fg.getBoundingClientRect();
    g.fg.style.transitionDuration = "1050ms";
    g.fg.style.transitionTimingFunction = "cubic-bezier(.16,.82,.2,1)";
    requestAnimationFrame(() => g.fg.setAttribute("stroke-dashoffset", g._target));
  } else if (now < (g._sweepUntil || 0)){
  } else {
    g.fg.style.transitionDuration = "";
    g.fg.style.transitionTimingFunction = "";
    g.fg.setAttribute("stroke-dashoffset", target);
  }

function buildEngMap(geom){
  const items = geom.split(",").map((t, i) => {
    if (!t || t === "-") return null;
    const p = t.split(":");
    const r = +p[0], a = +p[1];
    return isFinite(r) && isFinite(a) ? { i, r, a } : null;
  });
  const present = items.filter(Boolean);
  if (present.length < 3) return null;
  const maxR = Math.max(...present.map(o => o.r));
  const ringOf = r => r < maxR * 0.45 ? 0 : (r < maxR * 0.78 ? 1 : 2);

  const map = new Array(items.length).fill(-1);
  const dAng = (x, y) => Math.abs(((x - y + 540) % 360) - 180);

  for (let ring = 0; ring < 3; ring++){
    const eng = present.filter(o => ringOf(o.r) === ring).sort((x, y) => x.a - y.a);
    const art = ART_RINGS[ring].slice().sort((x, y) => ART_ANG[x] - ART_ANG[y]);
    if (!eng.length) continue;
    if (eng.length !== art.length){
      eng.forEach((o, k) => { if (art[k] !== undefined) map[o.i] = art[k]; });
      continue;
    }
    let best = 0, bestErr = Infinity;
    for (let sh = 0; sh < art.length; sh++){
      let err = 0;
      for (let k = 0; k < eng.length; k++)
        err += dAng(ART_ANG[art[(k + sh) % art.length]], eng[k].a);
      if (err < bestErr){ bestErr = err; best = sh; }
    }
    eng.forEach((o, k) => { map[o.i] = art[(k + best) % art.length]; });
  }
  return map;
}

function msShipOffset(){
  const b = B.next, sh = S.next;
  if (!b || !sh) return 0;
  if (typeof b.met !== "number" || typeof sh.met !== "number") return 0;
  if (typeof b.t   !== "number" || typeof sh.t   !== "number") return 0;

}

const MS_REF_TWR = 1.44;
const MS_ISP     = 310;
const MS_G0      = 9.80665;
const MS_SEP_REF = 108;

function msTWR(){
  const v = B.next && B.next.lotwr;
  return (typeof v === "number" && v > 0.5 && v < 5) ? v : 0;
}

function msBurnTime(tRef, twr){
  const k = 1 - tRef * MS_REF_TWR / MS_ISP;
  if (!(k > 0)) return tRef;
  const dv = -MS_ISP * MS_G0 * Math.log(k);
  return (MS_ISP / twr) * (1 - Math.exp(-dv / (MS_ISP * MS_G0)));

function msSepTime(){
  const ev = B.next && B.next.evsep;
  if (typeof ev === "number" && ev > 0) return ev;
  const twr = msTWR();
  return twr ? msBurnTime(MS_SEP_REF, twr) : MS_SEP_REF;
}

function msApriori(m){
  const twr = msTWR();
  if (!twr) return m.t;
  if (m.scale === "burn")     return msBurnTime(m.t, twr);
  if (m.scale === "afterSep") return msSepTime() + (m.t - MS_SEP_REF);
  return m.t;

  if (!m.ev) return null;
  const ch = m.src === "ship" ? S : B;
  if (!ch.next) return null;
  const v = ch.next[m.ev];
  if (!(typeof v === "number" && v > 0)) return null;

  if (!m.eta) return null;
  const ch = m.src === "ship" ? S : B;
  if (!ch.next) return null;
  const v = ch.next[m.eta];
  if (!(typeof v === "number" && v > 0)) return null;

function msState(m, met){
  if (!m.ev) return { t: m.t, done: met >= m.t };

  const f = msFact(m);
  if (f !== null) return { t: f, done: true };

  if (m.doneFlag){
    const ch = m.src === "ship" ? S : B;
    if (ch.next && ch.next[m.doneFlag] === true)
      return { t: Math.min(msApriori(m), met), done: true };

  const e = msEta(m);

    const ch = m.src === "ship" ? S : B;

  VIS_HALF = visHalfFor(curve);

    const m = arcSvg.querySelector("#" + id);
    if (!m) continue;
    m.setAttribute("x", (-0.1 * w).toFixed(0)); m.setAttribute("y", (-h).toFixed(0));
    m.setAttribute("width", (1.2 * w).toFixed(0)); m.setAttribute("height", (3 * h).toFixed(0));

const MS_LEVELS = [-15, 22, -38, 45, -61];

function paintArc(met, alt){
  if (!isFinite(met)) met = 0;
  if (!isFinite(alt)) alt = 0;
  curve = curveForAlt(alt);
  sag = sagForAlt(alt);
  if (!FREE_HALF) fitArc();
  {
    const wb = $("arcwrap").getBoundingClientRect();
    if (wb.height) BELOW = Math.max(0, window.innerHeight - wb.bottom) + 40;
  }
  VIS_HALF = visHalfFor(curve);

  arcLit.setAttribute("d", arcD(-VIS_HALF, 0));
  arcDim.setAttribute("d", arcD(0, VIS_HALF));

  const over = (exitXFor(curve) - FREE_HALF) / Math.max(1, FREE_HALF);
  const exiting = Math.max(0, Math.min(1, (TOP_Y + sag - (screenBottomY() - 26)) / 26));
  const fadeFrac = (0.07 + 0.13 * Math.max(0, Math.min(1, over * 2))) * (1 - exiting)
                 + 0.012 * exiting;
  arcSvg.querySelector("#f1").setAttribute("offset", fadeFrac.toFixed(3));
  arcSvg.querySelector("#f2").setAttribute("offset", (1 - fadeFrac).toFixed(3));
  const fr = arcSvg.querySelector("#fadrect");
  fr.setAttribute("x", (CX - VIS_HALF).toFixed(1));
  fr.setAttribute("width", (2 * VIS_HALF).toFixed(1));
  fr.setAttribute("y", -200); fr.setAttribute("height", VB_H + BELOW + 200);
  const er = arcSvg.querySelector("#earthrect");
  er.setAttribute("x", (CX - VIS_HALF).toFixed(1));
  er.setAttribute("width", (2 * VIS_HALF).toFixed(1));
  er.setAttribute("y", -200); er.setAttribute("height", VB_H + BELOW + 200);
  const eg = arcSvg.querySelector("#earthfill");
  eg.setAttribute("y1", TOP_Y);
  eg.setAttribute("y2", VB_H + BELOW * 0.5);

  const cr = arcSvg.querySelector("#cliprect");
  cr.setAttribute("x", 0); cr.setAttribute("width", VB_W);
  cr.setAttribute("y", -200); cr.setAttribute("height", VB_H + 200);

  if (curve < 0.02){
    earthPath.setAttribute("opacity", 0);
    arcInner.setAttribute("opacity", 0);
  } else {
    const k = Math.min(1, curve / 0.75);
    const dy2 = Math.max(8, VB_H * 0.13);
    const R2  = Math.max(20, sagRadius(sag) - dy2);
    const w2  = Math.min(VIS_HALF, R2 * 0.999);
    arcInner.setAttribute("d", arcDR(-w2, w2, R2, dy2));
    arcInner.setAttribute("opacity", (k * 0.75).toFixed(3));

    earthPath.setAttribute("d", earthD(R2, dy2));
    earthPath.setAttribute("opacity", k.toFixed(3));
  }

  const top = ptAtDX(0);
  tick.setAttribute("x1", top.x); tick.setAttribute("x2", top.x);
  tick.setAttribute("y1", top.y - 10); tick.setAttribute("y2", top.y + 6);

  const shown = [];
  for (const m of MS){
    const st = msState(m, met);
    const mt = st.t;
    const MH = msHalf();
    const dx = ((mt - met) / SPAN_SEC) * (2 * MH);
    const n = msNodes[m.id];
    if (st.hidden || Math.abs(dx) > MH + 6){ n.g.setAttribute("opacity", 0); continue; }

    const edge = Math.max(0, Math.min(1, (MH - Math.abs(dx)) / 70));
    n.g.setAttribute("opacity", edge.toFixed(2));

    const p = ptAtDX(dx);
    n.g.setAttribute("transform",
      `translate(${p.x.toFixed(1)},${p.y.toFixed(1)}) rotate(${p.deg.toFixed(2)})`);

    n.dot.setAttribute("class", "ms-dot" + (st.done ? " done" : ""));
    n.core.setAttribute("class", "ms-core" + (st.done ? " done" : ""));
    n.txt.setAttribute("class", "ms-txt" + (st.done ? " done" : ""));

    let w = 0;
    try { w = n.txt.getComputedTextLength(); } catch { w = 0; }
    shown.push({ n, x: p.x, half: w / 2 + 6 });
  }

  shown.sort((a, b) => a.x - b.x);
  const lastAt = [];
  for (const it of shown){
    let lvl = 0;
    while (lvl < MS_LEVELS.length - 1 &&
           lastAt[lvl] !== undefined && it.x - it.half < lastAt[lvl]) lvl++;
    lastAt[lvl] = it.x + it.half;
    it.n.txt.setAttribute("y", MS_LEVELS[lvl]);
  }
}

function hms(s){
  s = Math.max(0, Math.floor(s));
  const h = String(Math.floor(s/3600)).padStart(2,"0");
  const m = String(Math.floor(s/60)%60).padStart(2,"0");
  const q = String(s%60).padStart(2,"0");
  return `${h}:${m}:${q}`;
}

function render(){
  requestAnimationFrame(renderSafe);

  const bOK = fresh(B), sOK = fresh(S);
  document.body.classList.toggle("stale", !bOK && !sOK);

  const ph = bOK ? (B.next.phase || "idle") : "idle";

  if (ph === "boostback" && lastPhase !== "boostback"){
    revealEngines("b-eng");
    pendingSweep.add("b-eng");
  }
  lastPhase = ph;

  if (bOK){
    const mt = B.next.met ?? 0;
    if (mt < SHOW_AT - 1) launched = false;
    else if (mt >= SHOW_AT || (B.next.spd ?? 0) > 5 || (B.next.vs ?? 0) > 2 || ph !== "idle") launched = true;
  } else if (sOK){
    const mt = S.next.met ?? 0;
    if (mt < SHOW_AT - 1) launched = false;
    else if (mt >= SHOW_AT || (S.next.spd ?? 0) > 5 || (S.next.alt ?? 0) > 500) launched = true;
  }

  const radar = bOK ? (B.next.radar ?? 1e9) : 1e9;
  const back = (ph === "descent" || ph === "landing" || ph === "landed");
  const sEngOn = sOK && ((S.next.engact ?? 0) > 0 || (S.next.alt ?? 1e9) < SHIP_ENG_AT);
  const mode = !launched ? "pad"
             : !bOK ? (sOK ? (sEngOn ? "ship" : "shipg") : "pad")
             : ph === "idle" ? "booster"
             : back ? (radar < ENG_REVEAL_AT ? "land" : "descent")
             : "dual";
  applyLayout(mode);

  if (bOK){
    const spd = lerp(B,"spd") * 3.6, alt = Math.max(0, lerp(B,"alt") / 1000);
    setGauge(gBspd, spd, spd / 9000, 0, takeSweep("b-spd"));
    setGauge(gBalt, alt, alt / 130, 1, takeSweep("b-alt"));
    setGauge(gRspd, spd, spd / 9000, 0, takeSweep("r-spd"));
    setGauge(gRalt, alt, alt / 130, 1, takeSweep("r-alt"));
    setEngineArt(!!B.next.b3);
    paintLit(bLit, Math.round(B.next.engact ?? 0), B.next.engmask, B.next.enggeom);
    setFuel(bRing, Math.min(B.next.lfpct ?? 0, B.next.oxpct ?? 0), takeSweep("b-eng"));
    const pit = ang(B, "pitch") ?? 0;
    craftG.setAttribute("transform", `rotate(${pit.toFixed(1)})`);
  } else if (sOK){
    const sspd = lerp(S,"spd") * 3.6, salt = Math.max(0, lerp(S,"alt") / 1000);
    setGauge(gBspd, sspd, sspd / SHIP_SPD_FULL_KMH, 0, takeSweep("b-spd"));
    setGauge(gBalt, salt, salt / SHIP_ALT_FULL_KM, 1, takeSweep("b-alt"));
    setGauge(gRspd, null, 0, 0); setGauge(gRalt, null, 0, 1);
    paintLit(bLit, 0); setFuel(bRing, 0);
  } else {
    setGauge(gBspd, null, 0, 0); setGauge(gBalt, null, 0, 1);
    setGauge(gRspd, null, 0, 0); setGauge(gRalt, null, 0, 1);
    paintLit(bLit, 0); setFuel(bRing, 0);
  }

  if (sOK){
    const spd = lerp(S,"spd") * 3.6;
    setGauge(gSspd, spd, spd / SHIP_SPD_FULL_KMH, 0, takeSweep("s-spd"));
    const eSL = S.next.engsl, eVac = S.next.engvac;
    if (eSL !== undefined || eVac !== undefined)
      paintShipEngines(sRing, Math.round(eSL ?? 0), Math.round(eVac ?? 0), S.next.engmask);
    else paint(sRing, Math.round(S.next.engact ?? 0));
    setFuel(sRing, Math.min(S.next.lfpct ?? 0, S.next.oxpct ?? 0), takeSweep("s-eng"));
    const g = S.next.g ?? 0;
    setGauge(gSg, g, g / 6, 1, takeSweep("s-g"));
    const sp = ang(S, "pitch") ?? 0;
    const spScr = -sp;
    shipG.setAttribute("transform", `rotate(${spScr.toFixed(1)})`);
  } else {
    setGauge(gSspd, null, 0, 0); paint(sRing, 0); setFuel(sRing, 0);
    setGauge(gSg, null, 0, 1);
  }

  const met = bOK ? lerp(B,"met") : (sOK ? lerp(S,"met") : 0);
  const sign = met < 0 ? "T-" : "T+";
  $("met").innerHTML = `<span class="tp">${sign}</span>${hms(Math.abs(met))}`;
  $("toptp").textContent = sign;
  $("topmet").textContent = hms(Math.abs(met));
  document.body.classList.toggle("hold", isHold(met, bOK || sOK));
  const arcAlt = sOK ? (S.next.alt ?? 0) : (bOK ? (B.next.alt ?? 0) : 0);
  paintArc(met, arcAlt);

  const mission = (sOK ? S.next.mission : bOK ? B.next.mission : "") || "Starship Flight Test";
  if ($("mission").textContent !== mission) $("mission").textContent = mission;
  const missionU = mission.toUpperCase();
  if ($("topmission").textContent !== missionU) $("topmission").textContent = missionU;
}

let holdMet = null, holdSince = 0;
function isHold(met, live){
  const now = performance.now();
  if (!live || !(met < 0)){ holdMet = null; return false; }
  if (holdMet === null || Math.abs(met - holdMet) > 0.05){ holdMet = met; holdSince = now; return false; }
  return now - holdSince > 1500;
}

function renderSafe(){
  try {
    render();
    if (renderSafe.warned){ renderSafe.warned = false; $("jserr").style.display = "none"; }
  }
  catch (e){
    console.error("render:", e);
    const box = $("jserr");
    if (box){
      const stackLines = (e && e.stack || "").split(String.fromCharCode(10)).slice(0, 3).join(String.fromCharCode(10));
      box.textContent = "OVERLAY ERROR: " + (e && e.message || e) + String.fromCharCode(10) + stackLines;
      box.style.display = "block";
    }
    renderSafe.warned = true;
    requestAnimationFrame(renderSafe);
    return;
  }
}

function reconcileVisibility(){
  const on = LAYOUT[curMode] || [];
  for (const id of ALL_WIDGETS){
    const el = document.getElementById(id);
    if (!el) continue;
    if (pendingShow.has(id)) continue;
    const shouldShow = on.includes(id);
    const isVisible = getComputedStyle(el).display !== "none";
    if (shouldShow && !isVisible) revealWidget(el, id);
    else if (!shouldShow && isVisible && el.dataset.shown !== "0"){
      el.dataset.shown = "0";
      el.style.display = "none";
    }
  }
}
setInterval(reconcileVisibility, 1000);

  head("Сценарий");
  raw('<div class="hint">Гонит MET и зажигает вехи по расписанию. Логика вех зависит ' +
      'от последовательности во времени — одиночным кадром её не проверить.</div>');
  raw('<button id="sbxPlay">Проиграть</button>' +
      '<button id="sbxStop">Стоп</button>' +
      '<button id="sbxReset">Сброс</button>' +
      '<span class="chk">скорость x<input type="number" id="sbxRate" value="4" ' +
      'min="0.25" max="20" step="0.25" style="width:52px"></span>');

  head("Пресеты");
  raw('<div class="hint">Мгновенно ставит связный набор значений для момента полёта.</div>');
  var presets = [
    ["На столе",    {met:0,alt:0,radar:0,spd:0,vs:0,thr:0,engact:0,phase:"prelaunch",lfpct:100,evmaxq:-1,evsep:-1,evland:-1}],
    ["Разгон",      {met:40,alt:22000,radar:22000,spd:900,vs:400,thr:100,engact:33,phase:"ascent",lfpct:52}],
    ["Max Q",       {met:48,alt:26000,spd:1100,vs:430,evmaxq:47.7}],
    ["Сепарация",   {met:111,alt:35000,spd:1050,vs:610,engact:13,phase:"boostback",evsep:111,lfpct:34}],
    ["Снижение",    {met:250,alt:55000,radar:55000,spd:500,vs:-450,thr:0,engact:0,phase:"descent",lfpct:17}],
    ["Посад. ожог", {met:325,alt:3000,radar:3000,spd:290,vs:-280,thr:45,engact:13,phase:"landing",lfpct:8,arms:20}],
    ["Пойман",      {met:346,alt:86,radar:48,spd:0.6,vs:0,thr:0,engact:0,phase:"landed",evland:345.5,arms:5,lfpct:3}]
  ];
  var pbox = document.createElement("div");
  presets.forEach(function(p){
    var b = document.createElement("button");
    b.textContent = p[0];
    b.onclick = function(){ applyB(p[1]); };
    pbox.appendChild(b);
  });
  box.appendChild(pbox);

  head("Бустер — фаза");
  raw('<div class="row"><select id="sbxPhaseB">' +
      PHASE_B.map(function(p){ return '<option>'+p+'</option>'; }).join("") + '</select></div>');

  head("Бустер — числа");
  NUM_B.forEach(function(f){ slider("b", f[0], f[1], f[2], f[3], f[4]); });

  head("Бустер — вехи");
  raw('<div class="hint">−1 = события ещё не было, веха не должна гореть. ' +
      'Число = MET, когда оно случилось.</div>');
  EV_B.forEach(function(f){ slider("b", f[0], f[1], -1, 900, 0.1); });

  head("Корабль — фаза и миссия");
  raw('<div class="row"><select id="sbxPhaseS">' +
      PHASE_S.map(function(p){ return '<option>'+p+'</option>'; }).join("") + '</select></div>' +
      '<div class="row"><input type="text" id="sbxMission" value="' + st.s.mission + '"></div>');

  head("Корабль — числа");
  NUM_S.forEach(function(f){ slider("s", f[0], f[1], f[2], f[3], f[4]); });

  head("Корабль — вехи");
  EV_S.forEach(function(f){ slider("s", f[0], f[1], -1, 900, 0.1); });

  head("Экран это не показывает");
  raw('<div class="hint">Эти поля kOS пишет в telemetry.json, но ни один элемент ' +
      'экрана их не выводит — крутить бессмысленно, картинка не изменится. ' +
      'Держим на виду, чтобы было ясно, что уже есть в данных: пригодится, когда ' +
      'появится UI под Falcon 9. Сюда же относится go (Go/NoGo) — он есть в ' +
      'телеметрии и в CPU-меню, но не на полосе.</div>');
  var deadOpen = false;
  var deadBtn = document.createElement("button");
  deadBtn.textContent = "Показать (" + (DEAD_B.length + DEAD_S.length) + ")";
  var deadBox = document.createElement("div");
  deadBox.style.display = "none";
  box.appendChild(deadBtn);
  box.appendChild(deadBox);
  deadBtn.onclick = function(){
    deadOpen = !deadOpen;
    deadBox.style.display = deadOpen ? "" : "none";
    deadBtn.textContent = (deadOpen ? "Скрыть" : "Показать") +
                          " (" + (DEAD_B.length + DEAD_S.length) + ")";
  };
  (function(){
    var save = box;
    box = deadBox;
    head("Бустер — не на экране");
    DEAD_B.forEach(function(f){ slider("b", f[0], f[1], f[2], f[3], f[4]); });
    head("Корабль — не на экране");
    DEAD_S.forEach(function(f){ slider("s", f[0], f[1], f[2], f[3], f[4]); });
    box = save;
  })();

  document.getElementById("sbxPhaseB").onchange = function(e){ st.b.phase = e.target.value; };
  document.getElementById("sbxPhaseS").onchange = function(e){ st.s.phase = e.target.value; };
  document.getElementById("sbxMission").oninput = function(e){ st.s.mission = e.target.value; };

  function applyB(patch){
    Object.keys(patch).forEach(function(k){
      st.b[k] = patch[k];
      if (setters.b[k]) setters.b[k](patch[k]);
    });
    if (patch.phase) document.getElementById("sbxPhaseB").value = patch.phase;
  }
  function applyS(patch){
    Object.keys(patch).forEach(function(k){
      st.s[k] = patch[k];
      if (setters.s[k]) setters.s[k](patch[k]);
    });
    if (patch.phase) document.getElementById("sbxPhaseS").value = patch.phase;
  }

  var KF_B = [
    {t:0,   alt:0,     spd:0,    vs:0,    thr:100, eng:33, ph:"ascent",    lf:100},
    {t:48,  alt:26000, spd:1100, vs:430,  thr:100, eng:33, ph:"ascent",    lf:52},
    {t:111, alt:35000, spd:1050, vs:610,  thr:92,  eng:13, ph:"boostback", lf:34},
    {t:150, alt:54000, spd:520,  vs:465,  thr:0,   eng:0,  ph:"descent",   lf:22},
    {t:200, alt:65800, spd:236,  vs:0,    thr:0,   eng:0,  ph:"descent",   lf:22},
    {t:280, alt:34000, spd:790,  vs:-757, thr:0,   eng:0,  ph:"descent",   lf:17},
    {t:320, alt:5400,  spd:540,  vs:-521, thr:100, eng:13, ph:"landing",   lf:16},
    {t:340, alt:900,   spd:116,  vs:-115, thr:40,  eng:13, ph:"landing",   lf:5},
    {t:346, alt:86,    spd:0.6,  vs:0,    thr:0,   eng:0,  ph:"landed",    lf:3}
  ];
  var KF_S = [
    {t:0,   alt:0,      spd:0,    ap:0,      pe:-600000, thr:100, eng:6, ph:"Launch"},
    {t:111, alt:35000,  spd:1050, ap:60000,  pe:-500000, thr:100, eng:6, ph:"Ascent"},
    {t:300, alt:110000, spd:3100, ap:120000, pe:-20000,  thr:100, eng:6, ph:"Ascent"},
    {t:376, alt:123457, spd:3592, ap:127214, pe:123320,  thr:0,   eng:0, ph:"Coast"},
    {t:700, alt:60000,  spd:2000, ap:120000, pe:-50000,  thr:0,   eng:0, ph:"Entry"},
    {t:719, alt:0,      spd:2,    ap:0,      pe:-600000, thr:0,   eng:0, ph:"Landed"}
  ];
  function at(kf, t, key){
    if (t <= kf[0].t) return kf[0][key];
    for (var i=1;i<kf.length;i++){
      if (t <= kf[i].t){
        var a=kf[i-1], b=kf[i];
        if (typeof a[key] !== "number") return b[key];
        var k=(t-a.t)/(b.t-a.t);
        return a[key] + (b[key]-a[key])*k;
      }
    }
    return kf[kf.length-1][key];
  }

  var playing=false, tSim=0, tLast=0;
  document.getElementById("sbxPlay").onclick  = function(){ playing=true; tLast=performance.now(); };
  document.getElementById("sbxStop").onclick  = function(){ playing=false; };
  document.getElementById("sbxReset").onclick = function(){
    playing=false; tSim=0;
    applyB({met:0,evmaxq:-1,evsep:-1,evland:-1,evlandeta:-1});
    applyS({met:0,evseco:-1,evsecoeta:-1,evshipland:-1,evshiplandeta:-1});
  };

  function step(){
    if (!playing) return;
    var now = performance.now();
    var rate = parseFloat(document.getElementById("sbxRate").value) || 1;
    tSim += (now - tLast)/1000 * rate;
    tLast = now;
    if (tSim > 760){ playing = false; return; }
    applyB({met:+tSim.toFixed(1),
            alt:Math.round(at(KF_B,tSim,"alt")), radar:Math.round(at(KF_B,tSim,"alt")),
            spd:Math.round(at(KF_B,tSim,"spd")), vs:Math.round(at(KF_B,tSim,"vs")),
            thr:Math.round(at(KF_B,tSim,"thr")), engact:Math.round(at(KF_B,tSim,"eng")),
            lfpct:+at(KF_B,tSim,"lf").toFixed(1), phase:at(KF_B,tSim,"ph")});
    applyS({met:+tSim.toFixed(1),
            alt:Math.round(at(KF_S,tSim,"alt")), spd:Math.round(at(KF_S,tSim,"spd")),
            ap:Math.round(at(KF_S,tSim,"ap")), pe:Math.round(at(KF_S,tSim,"pe")),
            thr:Math.round(at(KF_S,tSim,"thr")), engvac:Math.round(at(KF_S,tSim,"eng")),
            phase:at(KF_S,tSim,"ph")});
    if (tSim >= 47.7  && st.b.evmaxq     < 0) applyB({evmaxq:47.7});
    if (tSim >= 111   && st.b.evsep      < 0) applyB({evsep:111});
    if (tSim >= 345.5 && st.b.evland     < 0) applyB({evland:345.5});
    if (tSim >= 375.4 && st.s.evseco     < 0) applyS({evseco:375.4});
    if (tSim >= 719   && st.s.evshipland < 0) applyS({evshipland:719});
  }

  setInterval(function(){
    step();
    var b = {}, s = {};
    Object.keys(st.b).forEach(function(k){ b[k] = st.b[k]; });
    Object.keys(st.s).forEach(function(k){ s[k] = st.s[k]; });
    b.engmask = mask(b.engact, 33);
    s.engmask = mask(s.engvac, 6);
    push(B, b);
    push(S, s);
  }, 100);
})();
</script>
</body>
</html>
